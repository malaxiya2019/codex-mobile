name: 构建 ChinaCode APK

on:
  push:
    tags:
      - 'v*'
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 克隆 Termux 源码
        run: git clone --depth=1 https://github.com/termux/termux-app.git

      - name: 下载并预置 bootstrap（避免首次启动下载+权限问题）
        run: |
          mkdir -p termux-app/app/src/main/assets/codex-mobile
          BOOTSTRAP_URL="https://github.com/termux/termux-packages/releases/download/bootstrap-2026.02.12-r1%2Bapt.android-7/bootstrap-aarch64.zip"
          echo "📥 下载 bootstrap..."
          curl -sL -o bootstrap.zip "$BOOTSTRAP_URL"
          mkdir -p bootstrap-tmp
          unzip -q bootstrap.zip -d bootstrap-tmp/
          # tar 打包保留权限（包括可执行位），这样解压后 login 等文件自动有执行权限
          echo "📦 打包 bootstrap 到 assets..."
          tar czf termux-app/app/src/main/assets/codex-mobile/bootstrap.tar.gz \
            -C bootstrap-tmp/data/data/com.termux/files/usr .
          rm -rf bootstrap-tmp bootstrap.zip
          echo "✅ bootstrap 预置完成 ($(du -sh termux-app/app/src/main/assets/codex-mobile/bootstrap.tar.gz | cut -f1))"

      - name: 打包配置 (home 目录)
        run: |
          SETUP_DIR="$(mktemp -d)"
          mkdir -p "$SETUP_DIR/.termux"
          mkdir -p "$SETUP_DIR/.local/bin"
          mkdir -p "$SETUP_DIR/.codex/skills"
          cp config/home/* "$SETUP_DIR/" 2>/dev/null || true
          cp config/termux/* "$SETUP_DIR/.termux/" 2>/dev/null || true
          cp config/bin/* "$SETUP_DIR/.local/bin/" 2>/dev/null || true
          cp -r config/codex/skills/* "$SETUP_DIR/.codex/skills/" 2>/dev/null || true
          cp config/scripts/backup-termux-codex.sh "$SETUP_DIR/" 2>/dev/null || true
          cp scripts/install-codex.sh "$SETUP_DIR/" 2>/dev/null || true
          tar czf termux-app/app/src/main/assets/codex-mobile/setup.tar.gz \
            -C "$SETUP_DIR" .
          rm -rf "$SETUP_DIR"

      - name: 打补丁
        run: bash scripts/patch-termux.sh

      - name: 构建 APK
        run: |
          cd termux-app
          ./gradlew assembleDebug

      - name: 上传 APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: chinacode-${{ github.ref_name || 'latest' }}
          path: termux-app/app/build/outputs/apk/debug/*.apk

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: termux-app/app/build/outputs/apk/debug/*.apk
          body: |
            ## ChinaCode ${{ github.ref_name }}

            定价: 49.9 元

            安装:
            1. 下载 APK 安装（可与原版 Termux 共存）
            2. 首次打开自动解压 bootstrap + 配置
            3. 运行 cyo --zh 启动 Codex

            注意: 本 APK 内置 bootstrap，首次启动无需网络下载
